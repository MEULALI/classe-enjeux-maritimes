<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Côtière et Ports de Tunisie</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Style CSS strict pour le conteneur de la carte afin d'éviter tout écran blanc */
    #map {
      width: 100%;
      height: 100%;
      min-height: 550px;
      border-radius: 0.75rem;
      z-index: 1;
      background-color: #0f172a;
    }

    /* Style des popups Leaflet */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .leaflet-popup-tip {
      background: #0f172a;
      border: 1px solid #334155;
    }
    .leaflet-container a.leaflet-popup-close-button {
      color: #94a3b8;
      padding: 6px;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100">

  <!-- En-tête -->
  <header class="bg-slate-900 border-b border-slate-800 py-3 px-4 sm:px-6 z-10 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-sky-500/10 border border-sky-500/30 rounded-lg text-sky-400">
          <i data-lucide="anchor" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white tracking-wide">
            Carte du Littoral et des Ports de Tunisie
          </h1>
          <p class="text-xs text-slate-400">Façade méditerranéenne et zones côtières</p>
        </div>
      </div>

      <!-- Filtres -->
      <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
        <button onclick="filterMarkers('all')" id="btn-all" class="filter-btn active px-3 py-1.5 rounded-md font-medium bg-sky-600 text-white transition">
          Tous
        </button>
        <button onclick="filterMarkers('commerce')" id="btn-commerce" class="filter-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition">
          Commerce
        </button>
        <button onclick="filterMarkers('peche')" id="btn-peche" class="filter-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition">
          Pêche
        </button>
        <button onclick="filterMarkers('plaisance')" id="btn-plaisance" class="filter-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition">
          Plaisance
        </button>
        <button onclick="filterMarkers('zone')" id="btn-zone" class="filter-btn px-3 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition">
          Golfes & Îles
        </button>
      </div>
    </div>
  </header>

  <!-- Disposition : Carte & Panneau -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4 min-h-[600px]">
    
    <!-- Carte Leaflet -->
    <div class="lg:col-span-8 xl:col-span-9 bg-slate-900 rounded-xl border border-slate-800 p-2 relative flex flex-col shadow-xl min-h-[550px]">
      <div id="map"></div>
    </div>

    <!-- Liste latérale -->
    <div class="lg:col-span-4 xl:col-span-3 bg-slate-900 rounded-xl border border-slate-800 p-4 flex flex-col justify-between overflow-hidden shadow-xl max-h-[650px]">
      <div class="flex flex-col h-full overflow-hidden">
        
        <!-- Légende -->
        <div class="mb-4 pb-3 border-b border-slate-800">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1.5">
            <i data-lucide="layers" class="w-4 h-4 text-sky-400"></i> Légende
          </h2>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
              <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
              <span class="text-slate-300">Port de Commerce</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
              <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
              <span class="text-slate-300">Port de Pêche</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
              <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
              <span class="text-slate-300">Port de Plaisance</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
              <span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span>
              <span class="text-slate-300">Golfe / Île</span>
            </div>
          </div>
        </div>

        <!-- Liste des ports -->
        <div class="flex-1 overflow-y-auto pr-1 space-y-1.5" id="location-list">
          <!-- Injecté dynamiquement par JS -->
        </div>
      </div>

      <button onclick="resetMapView()" class="mt-4 w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition flex items-center justify-center gap-2 border border-slate-700">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Recadrer la carte
      </button>
    </div>

  </div>

  <script>
    // Données des ports tunisiens et zones côtières
    const pointsData = [
      { name: "Port de Tabarka", type: "peche", typeLabel: "Port de Pêche & Plaisance", lat: 36.9583, lng: 8.7606, color: "#10b981" },
      { name: "Port de Bizerte", type: "commerce", typeLabel: "Port de Commerce", lat: 37.2744, lng: 9.8739, color: "#3b82f6" },
      { name: "Port de Menzel Bourguiba", type: "commerce", typeLabel: "Port de Commerce", lat: 37.1581, lng: 9.7942, color: "#3b82f6" },
      { name: "Port de La Goulette", type: "commerce", typeLabel: "Port de Commerce & Passagers", lat: 36.8181, lng: 10.3050, color: "#3b82f6" },
      { name: "Port de Radès", type: "commerce", typeLabel: "Port de Commerce", lat: 36.8015, lng: 10.2842, color: "#3b82f6" },
      { name: "Port de Sidi Bou Saïd", type: "plaisance", typeLabel: "Port de Plaisance", lat: 36.8708, lng: 10.3475, color: "#f59e0b" },
      { name: "Port de Kélibia", type: "peche", typeLabel: "Port de Pêche", lat: 36.8375, lng: 11.1042, color: "#10b981" },
      { name: "Port Yasmine Hammamet", type: "plaisance", typeLabel: "Port de Plaisance", lat: 36.3719, lng: 10.5361, color: "#f59e0b" },
      { name: "Port de Sousse", type: "commerce", typeLabel: "Port de Commerce & Pêche", lat: 35.8286, lng: 10.6433, color: "#3b82f6" },
      { name: "Port de Monastir", type: "plaisance", typeLabel: "Port de Plaisance", lat: 35.7761, lng: 10.8358, color: "#f59e0b" },
      { name: "Port de Mahdia", type: "peche", typeLabel: "Port de Pêche", lat: 35.5042, lng: 11.0722, color: "#10b981" },
      { name: "Port de Sfax", type: "commerce", typeLabel: "Port de Commerce", lat: 34.7333, lng: 10.7667, color: "#3b82f6" },
      { name: "Port d'El Attaya (Kerkennah)", type: "peche", typeLabel: "Port de Pêche", lat: 34.7386, lng: 11.2889, color: "#10b981" },
      { name: "Port de Gabès", type: "commerce", typeLabel: "Port de Commerce", lat: 33.9000, lng: 10.1000, color: "#3b82f6" },
      { name: "Port d'Houmt Souk (Djerba)", type: "peche", typeLabel: "Port de Pêche & Plaisance", lat: 33.8825, lng: 10.8586, color: "#10b981" },
      { name: "Port de Zarzis", type: "commerce", typeLabel: "Port de Commerce & Pêche", lat: 33.5036, lng: 11.1119, color: "#3b82f6" },
      
      // Golfes & îles
      { name: "Archipel de La Galite", type: "zone", typeLabel: "Archipel Insulaire", lat: 37.5258, lng: 8.9958, color: "#a855f7" },
      { name: "Île de Zembra", type: "zone", typeLabel: "Île Côtière", lat: 37.1328, lng: 10.8081, color: "#a855f7" },
      { name: "Golfe de Tunis", type: "zone", typeLabel: "Golfe Côtier", lat: 36.9000, lng: 10.4500, color: "#a855f7" },
      { name: "Golfe de Hammamet", type: "zone", typeLabel: "Golfe Côtier", lat: 36.0000, lng: 10.7000, color: "#a855f7" },
      { name: "Îles Kerkennah", type: "zone", typeLabel: "Archipel Côtier", lat: 34.6931, lng: 11.1681, color: "#a855f7" },
      { name: "Golfe de Gabès", type: "zone", typeLabel: "Golfe Côtier", lat: 34.0000, lng: 10.5000, color: "#a855f7" },
      { name: "Île de Djerba", type: "zone", typeLabel: "Île Côtière", lat: 33.8075, lng: 10.8806, color: "#a855f7" }
    ];

    let map;
    let markersList = [];

    function initMap() {
      // 1. Initialiser la carte centrée sur la Tunisie complète
      map = L.map('map', {
        zoomControl: true
      }).setView([34.0, 9.5], 6.5);

      // 2. Tuiles OpenStreetMap Standard
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 5,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      // 3. Forcer la mise à jour du rendu pour éviter les carrés gris ou le fond blanc
      setTimeout(() => {
        map.invalidateSize();
      }, 200);

      // Tracé de la ligne de côte méditerranéenne
      const coastlineCoords = [
        [36.9583, 8.7606],
        [37.2744, 9.8739],
        [36.8708, 10.3475],
        [36.8375, 11.1042],
        [36.3719, 10.5361],
        [35.8286, 10.6433],
        [35.5042, 11.0722],
        [34.7333, 10.7667],
        [33.9000, 10.1000],
        [33.5036, 11.1119]
      ];

      L.polyline(coastlineCoords, {
        color: '#0284c7',
        weight: 3,
        opacity: 0.7,
        dashArray: '5, 8'
      }).addTo(map);

      // Marqueurs
      pointsData.forEach((pt) => {
        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div style="
            background-color: ${pt.color};
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px ${pt.color};
          "></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        const marker = L.marker([pt.lat, pt.lng], { icon: customIcon }).addTo(map);

        // Survol/Clic : affiche UNIQUEMENT le nom et la catégorie
        const popupContent = `
          <div class="py-1 px-1">
            <h3 class="text-xs font-bold text-white mb-0.5">${pt.name}</h3>
            <span class="text-[11px] font-medium text-sky-400">${pt.typeLabel}</span>
          </div>
        `;

        marker.bindPopup(popupContent);
        marker.pointData = pt;
        markersList.push(marker);
      });

      renderLocationList(pointsData);
    }

    function renderLocationList(items) {
      const listContainer = document.getElementById('location-list');
      listContainer.innerHTML = '';

      items.forEach((pt) => {
        const item = document.createElement('div');
        item.className = "p-2 bg-slate-950/60 hover:bg-slate-800/80 border border-slate-800/80 rounded-lg cursor-pointer transition text-xs flex items-center justify-between";
        item.innerHTML = `
          <div>
            <span class="font-semibold text-slate-200 block">${pt.name}</span>
            <span class="text-[11px] text-sky-400">${pt.typeLabel}</span>
          </div>
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${pt.color}"></span>
        `;
        
        item.onclick = () => {
          map.setView([pt.lat, pt.lng], 10);
          const targetMarker = markersList.find(m => m.pointData.name === pt.name);
          if (targetMarker) targetMarker.openPopup();
        };

        listContainer.appendChild(item);
      });
    }

    function filterMarkers(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-sky-600', 'text-white');
        btn.classList.add('text-slate-400');
      });

      const activeBtn = document.getElementById(`btn-${category}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-sky-600', 'text-white');
        activeBtn.classList.remove('text-slate-400');
      }

      const filteredData = [];
      markersList.forEach(marker => {
        if (category === 'all' || marker.pointData.type === category) {
          map.addLayer(marker);
          filteredData.push(marker.pointData);
        } else {
          map.removeLayer(marker);
        }
      });

      renderLocationList(filteredData);
    }

    function resetMapView() {
      map.setView([34.0, 9.5], 6.5);
      filterMarkers('all');
    }

    window.onload = function() {
      initMap();
      lucide.createIcons();
    };

    window.onresize = function() {
      if (map) map.invalidateSize();
    };
  </script>
</body>
</html>
